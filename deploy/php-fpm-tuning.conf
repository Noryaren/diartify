; Contoh pengaturan ramah server kecil (RAM 2 GB, Atom N550).
; Tempel di /etc/php/8.5/fpm/pool.d/www.conf atau pool khusus Diarify,
; lalu jalankan: sudo systemctl reload php8.5-fpm
;
; Catatan: file ini berbagi pool dengan situs lain di server yang sama.
; Turunkan angka jika masih ada situs PHP lain yang ikut makan memori.

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 300

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60

; Streaming audio membaca file besar per-chunk; OPcache wajib aktif (sudah
; default di Debian) supaya setiap request tidak mengompilasi ulang.
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 64
